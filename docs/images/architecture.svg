<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
  <title>s200-weightlog architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#FFF7F0"/>
    </linearGradient>
    <linearGradient id="mac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="scaleGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF5"/>
    </linearGradient>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8533" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8533" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FE0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F9D66"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F07020"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="40" y="54" font-size="24" font-weight="700" fill="#0F172A">s200-weightlog</text>
  <text x="250" y="54" font-size="15" fill="#64748B">乗るだけで記録 — すべて自分の Mac の中で動く</text>

  <!-- ============ left: scale ============ -->
  <g filter="url(#shadow)">
    <rect x="48" y="128" width="184" height="184" rx="34" fill="url(#scaleGlass)" stroke="#D5DDE8"/>
  </g>
  <rect x="98" y="150" width="84" height="34" rx="10" fill="#111827"/>
  <text x="140" y="174" font-size="18" font-weight="700" fill="#E5F0FF" text-anchor="middle" font-variant-numeric="tabular-nums">72.6</text>
  <circle cx="140" cy="250" r="30" fill="none" stroke="#D5DDE8" stroke-width="2"/>
  <path d="M126 252 q14 -16 28 0" fill="none" stroke="#C3CDDB" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="306" width="22" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="188" y="306" width="22" height="8" rx="4" fill="#CBD5E1"/>
  <text x="140" y="346" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Xiaomi S200</text>
  <text x="140" y="368" font-size="13" fill="#64748B" text-anchor="middle">スマート体重計</text>

  <!-- broadcast waves -->
  <g fill="none" stroke="#2F6FE0" stroke-linecap="round">
    <path d="M246 196 a26 26 0 0 1 0 40" stroke-width="3" opacity="0.9"/>
    <path d="M258 184 a42 42 0 0 1 0 64" stroke-width="3" opacity="0.6"/>
    <path d="M270 172 a58 58 0 0 1 0 88" stroke-width="3" opacity="0.35"/>
  </g>
  <line x1="282" y1="216" x2="324" y2="216" stroke="#2F6FE0" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <g font-size="12" fill="#334155">
    <rect x="232" y="272" width="104" height="58" rx="10" fill="#FFFFFF" stroke="#DBE5F3"/>
    <text x="284" y="292" text-anchor="middle" font-weight="600" fill="#2F6FE0">BLE 広告</text>
    <text x="284" y="308" text-anchor="middle">0xFE95</text>
    <text x="284" y="323" text-anchor="middle" font-size="11">AES-CCM 暗号化</text>
  </g>
  <text x="284" y="350" font-size="11.5" fill="#64748B" text-anchor="middle">受信するだけ</text>
  <text x="284" y="365" font-size="11.5" fill="#64748B" text-anchor="middle">（接続しない）</text>

  <!-- phone: setup only -->
  <rect x="48" y="430" width="184" height="150" rx="22" fill="#FFFFFF" fill-opacity="0.6" stroke="#CBD5E1" stroke-dasharray="6 6"/>
  <rect x="72" y="452" width="40" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="86" y="457" width="12" height="3" rx="1.5" fill="#94A3B8"/>
  <text x="124" y="472" font-size="13.5" font-weight="700" fill="#334155">Xiaomi Home</text>
  <text x="124" y="491" font-size="12" fill="#64748B">初回だけ</text>
  <text x="124" y="508" font-size="12" fill="#64748B">ペアリング</text>
  <text x="64" y="548" font-size="12" fill="#64748B">→ 鍵（BLE KEY）を</text>
  <text x="64" y="565" font-size="12" fill="#64748B">　 抽出して config へ</text>
  <path d="M140 430 L140 384" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

  <!-- ============ middle: Mac ============ -->
  <g filter="url(#shadow)">
    <rect x="340" y="96" width="470" height="548" rx="22" fill="url(#mac)" stroke="#D5DDE8"/>
  </g>
  <path d="M340 118 a22 22 0 0 1 22 -22 h426 a22 22 0 0 1 22 22 v26 h-470 z" fill="#EEF2F7"/>
  <circle cx="364" cy="120" r="6" fill="#FF5F57"/>
  <circle cx="384" cy="120" r="6" fill="#FEBC2E"/>
  <circle cx="404" cy="120" r="6" fill="#28C840"/>
  <text x="575" y="125" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Mac  ·  s200 run</text>
  <text x="790" y="125" font-size="11.5" fill="#64748B" text-anchor="end">launchd + caffeinate</text>

  <!-- module helper: white card with colored stripe -->
  <!-- scanner -->
  <g filter="url(#soft)">
    <rect x="364" y="170" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="364" y="170" width="6" height="70" rx="3" fill="#2F6FE0"/>
  <text x="384" y="198" font-size="14.5" font-weight="700" fill="#0F172A">scanner</text>
  <text x="384" y="220" font-size="12" fill="#64748B">bleak で受信・寝起きを記録</text>

  <!-- mibeacon -->
  <g filter="url(#soft)">
    <rect x="586" y="170" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="586" y="170" width="6" height="70" rx="3" fill="#7C5CE0"/>
  <text x="606" y="198" font-size="14.5" font-weight="700" fill="#0F172A">mibeacon</text>
  <text x="606" y="220" font-size="12" fill="#64748B">復号 → 体重・時刻</text>
  <line x1="564" y1="205" x2="582" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- store -->
  <g filter="url(#soft)">
    <rect x="364" y="276" width="200" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="364" y="276" width="6" height="86" rx="3" fill="#0EA5A4"/>
  <g transform="translate(520 292)" fill="none" stroke="#0EA5A4" stroke-width="1.8">
    <ellipse cx="14" cy="5" rx="14" ry="5"/>
    <path d="M0 5 v20 a14 5 0 0 0 28 0 v-20"/>
    <path d="M0 15 a14 5 0 0 0 28 0"/>
  </g>
  <text x="384" y="304" font-size="14.5" font-weight="700" fill="#0F172A">store</text>
  <text x="384" y="326" font-size="12" fill="#64748B">SQLite に保存</text>
  <text x="384" y="344" font-size="12" fill="#64748B">外れ値は消さず「除外」</text>

  <!-- analysis -->
  <g filter="url(#soft)">
    <rect x="586" y="276" width="200" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="586" y="276" width="6" height="86" rx="3" fill="#FF8533"/>
  <text x="606" y="304" font-size="14.5" font-weight="700" fill="#0F172A">analysis</text>
  <text x="606" y="326" font-size="12" fill="#64748B">トレンド・外れ値・ペース</text>
  <text x="606" y="344" font-size="12" fill="#64748B">予定日・節目・ひとこと</text>
  <path d="M686 240 C686 256 474 256 474 272" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="319" x2="582" y2="319" stroke="#64748B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- event hub bus -->
  <rect x="364" y="398" width="422" height="34" rx="17" fill="#EEF4FF" stroke="#C9D8F6"/>
  <text x="575" y="420" font-size="12.5" font-weight="600" fill="#2F6FE0" text-anchor="middle">EventHub — 新しい記録・編集を配信</text>
  <line x1="474" y1="362" x2="474" y2="394" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- drive -->
  <g filter="url(#soft)">
    <rect x="364" y="466" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="364" y="466" width="6" height="70" rx="3" fill="#1F9D66"/>
  <text x="384" y="494" font-size="14.5" font-weight="700" fill="#0F172A">drive</text>
  <text x="384" y="516" font-size="12" fill="#64748B">変更 60 秒後にまとめて</text>
  <line x1="464" y1="432" x2="464" y2="462" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- web -->
  <g filter="url(#soft)">
    <rect x="586" y="466" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="586" y="466" width="6" height="70" rx="3" fill="#2F6FE0"/>
  <text x="606" y="494" font-size="14.5" font-weight="700" fill="#0F172A">web</text>
  <text x="606" y="516" font-size="12" fill="#64748B">JSON API + SSE :8200</text>
  <line x1="686" y1="432" x2="686" y2="462" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- local files -->
  <g font-size="11.5" fill="#475569">
    <rect x="364" y="592" width="112" height="28" rx="14" fill="#F1F5F9"/>
    <text x="420" y="610" text-anchor="middle">config.toml</text>
    <rect x="486" y="592" width="132" height="28" rx="14" fill="#F1F5F9"/>
    <text x="552" y="610" text-anchor="middle">weights.sqlite3</text>
    <rect x="628" y="592" width="158" height="28" rx="14" fill="#F1F5F9"/>
    <text x="707" y="610" text-anchor="middle">logs/  ·  .drive/ (token)</text>
  </g>

  <!-- ============ right: app ============ -->
  <g filter="url(#shadow)">
    <rect x="870" y="96" width="290" height="250" rx="22" fill="#FFFFFF" stroke="#D5DDE8"/>
  </g>
  <!-- mini window -->
  <rect x="892" y="118" width="246" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="892" y="118" width="58" height="150" rx="12" fill="#EEF2F7"/>
  <rect x="938" y="118" width="12" height="150" fill="#EEF2F7"/>
  <circle cx="904" cy="130" r="3.5" fill="#FF5F57"/>
  <circle cx="915" cy="130" r="3.5" fill="#FEBC2E"/>
  <circle cx="926" cy="130" r="3.5" fill="#28C840"/>
  <rect x="900" y="146" width="42" height="9" rx="4.5" fill="#D6DEEA"/>
  <rect x="900" y="162" width="34" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="900" y="174" width="30" height="6" rx="3" fill="#E2E8F0"/>
  <text x="962" y="152" font-size="22" font-weight="800" fill="#0F172A">72.60</text>
  <text x="1030" y="152" font-size="10" fill="#64748B">kg</text>
  <rect x="1050" y="138" width="76" height="16" rx="8" fill="#DDF5EA"/>
  <text x="1088" y="150" font-size="9.5" font-weight="700" fill="#1F9D66" text-anchor="middle">↘ -0.30 kg/週</text>
  <path d="M962 246 L962 206 C985 200 1000 214 1022 210 C1046 206 1062 222 1086 220 C1104 219 1116 228 1128 230 L1128 246 Z" fill="url(#trendFill)"/>
  <path d="M962 206 C985 200 1000 214 1022 210 C1046 206 1062 222 1086 220 C1104 219 1116 228 1128 230" fill="none" stroke="#FF8533" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#2F6FE0">
    <circle cx="968" cy="200" r="2.6"/><circle cx="984" cy="210" r="2.6"/><circle cx="998" cy="198" r="2.6"/>
    <circle cx="1012" cy="216" r="2.6"/><circle cx="1030" cy="204" r="2.6"/><circle cx="1046" cy="214" r="2.6"/>
    <circle cx="1060" cy="226" r="2.6"/><circle cx="1076" cy="214" r="2.6"/><circle cx="1092" cy="228" r="2.6"/>
    <circle cx="1108" cy="222" r="2.6"/><circle cx="1122" cy="234" r="2.6"/>
  </g>
  <line x1="962" y1="256" x2="1128" y2="256" stroke="#2EB87A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="892" y="296" font-size="15" font-weight="700" fill="#0F172A">WeightLog.app</text>
  <text x="1012" y="296" font-size="12" fill="#64748B">SwiftUI</text>
  <text x="892" y="318" font-size="12" fill="#64748B">グラフ・カレンダー・メモ・除外</text>
  <text x="892" y="335" font-size="12" fill="#64748B">乗った瞬間のリアクションと通知</text>

  <!-- web → app -->
  <path d="M786 492 H812 Q830 492 830 474 V318 Q830 300 848 300 H866" fill="none" stroke="#2F6FE0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="806" y="360" width="48" height="44" rx="10" fill="#FFFFFF" stroke="#C9D8F6"/>
  <text x="830" y="378" font-size="11" font-weight="700" fill="#2F6FE0" text-anchor="middle">API</text>
  <text x="830" y="394" font-size="11" font-weight="700" fill="#2F6FE0" text-anchor="middle">SSE</text>

  <!-- ============ right: Google Drive ============ -->
  <g filter="url(#shadow)">
    <rect x="870" y="392" width="290" height="216" rx="22" fill="#FFFFFF" stroke="#D5DDE8"/>
  </g>
  <!-- cloud -->
  <path d="M898 434 h22 a8 8 0 0 0 0 -16 a10 10 0 0 0 -19 -3 a7 7 0 0 0 -3 19 z" fill="#E7F7EF" stroke="#1F9D66" stroke-width="2" stroke-linejoin="round"/>
  <text x="940" y="433" font-size="15" font-weight="700" fill="#0F172A">Google Drive</text>
  <text x="1052" y="433" font-size="12" fill="#64748B">任意</text>
  <g font-size="12" fill="#334155">
    <rect x="892" y="452" width="246" height="30" rx="8" fill="#ECFDF3"/>
    <rect x="902" y="460" width="14" height="14" rx="3" fill="#1F9D66"/>
    <path d="M905 465 h8 M905 469 h8 M909 462 v10" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="924" y="472">weights / daily  スプレッドシート</text>
    <rect x="892" y="488" width="246" height="30" rx="8" fill="#F1F5F9"/>
    <text x="902" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">csv</text>
    <text x="930" y="508">weights.csv / daily.csv（AI 連携）</text>
    <rect x="892" y="524" width="246" height="30" rx="8" fill="#F1F5F9"/>
    <text x="902" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">db</text>
    <text x="930" y="544">backups/ 日次スナップショット</text>
  </g>
  <text x="892" y="582" font-size="11.5" fill="#64748B">権限は drive.file（このアプリのファイルだけ）</text>

  <!-- drive → Google Drive -->
  <path d="M464 536 V552 Q464 562 474 562 H830 Q846 562 846 546 V540 Q846 530 856 530 H866" fill="none" stroke="#1F9D66" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- footer -->
  <text x="40" y="676" font-size="12" fill="#94A3B8">外部に出るのは、自分の Google Drive へのアップロード（任意）だけ。API は localhost 専用。</text>
</svg>
