<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体重ログ API</title>
<style>
  :root { --bg: #f7f7f5; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --text: #f2f2f7; --muted: #9a9aa0; } }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  .big { font-size: 48px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="muted">体重ログ API は動作中です。表示は WeightLog アプリで。</p>
  <div class="big" id="w">–</div>
  <p id="c" class="muted"></p>
  <p class="muted"><code>/api/summary</code> · <code>/api/readings</code> · <code>/api/notes</code> · <code>/api/settings</code> · <code>/api/stream</code></p>
</main>
<script>
async function load() {
  try {
    const s = await (await fetch("/api/summary")).json();
    document.getElementById("w").textContent = s.latest ? `${s.latest.weight_kg.toFixed(2)} kg` : "–";
    document.getElementById("c").textContent = s.comment;
  } catch (e) { console.error(e); }
}
load();
const es = new EventSource("/api/stream");
["reading", "changed"].forEach(t => es.addEventListener(t, load));
</script>
</body>
</html>
