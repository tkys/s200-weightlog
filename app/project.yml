name: WeightLog
options:
  bundleIdPrefix: dev.tkysyskw
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  WeightLog:
    type: application
    platform: macOS
    sources: [WeightLog]
    info:
      path: WeightLog/Info.plist
      properties:
        CFBundleDisplayName: 体重ログ
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tkysyskw.WeightLog
        PRODUCT_NAME: WeightLog
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  WeightLogTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WeightLogTests]
    dependencies:
      - target: WeightLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tkysyskw.WeightLogTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WeightLog:
    build:
      targets:
        WeightLog: all
        WeightLogTests: [test]
    test:
      targets: [WeightLogTests]
