[project]
name = "s200"
version = "0.1.0"
description = "Passive BLE weight logger for the Xiaomi Smart Scale S200"
requires-python = ">=3.13"
dependencies = [
    "bleak>=1.0",
    "cryptography>=44",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
s200 = "s200.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
